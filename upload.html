<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Upload a mod! - PTEM Mods</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines"></div>
<header class="site-header">
  <div class="brand"><img src="assets/logo.png" class="logo-image" alt="PTEM Mods"></div>
  <nav class="main-nav">
    <a href="index.html"><img src="assets/nav-mods.png" alt=""> Mods</a>
    <a href="#"><img src="assets/nav-login.png" alt=""> Log In</a>
    <a href="#"><img src="assets/nav-signup.png" alt=""> Sign Up</a>
    <a href="upload.html"><img src="assets/nav-upload.png" alt=""> Upload</a>
  </nav>
</header>
<main class="page">
  <div class="mod-topbar"><a class="back-link" href="index.html">← Go Back</a></div>
  <section class="detail-panel description-panel">
    <h1 class="panel-title">UPLOAD A MOD!</h1>
    <form id="upload-form">
      <label>Mod name<br><input id="name" required maxlength="80"></label><br><br>
      <label>Version<br><input id="version" required maxlength="30" value="1.0"></label><br><br>
      <label>Small description<br><input id="smalldesc" maxlength="180"></label><br><br>
      <label>Description<br><textarea id="description" required maxlength="10000" rows="8"></textarea></label><br><br>
      <label>Credits (one per line)<br><textarea id="credits" rows="5" placeholder="Peppeno - Creador"></textarea></label><br><br>
      <label>Mod ZIP (max 50 MB)<br><input id="zip" type="file" accept=".zip,application/zip" required></label><br><br>
      <label>Icon PNG (optional)<br><input id="icon" type="file" accept="image/png"></label><br><br>
      <label>Banner PNG (optional)<br><input id="banner" type="file" accept="image/png"></label><br><br>
      <button type="submit">UPLOAD MOD</button>
    </form>
    <p id="status" class="missing"></p>
  </section>
</main>
<footer>PTEM LOADER MODS</footer>
<script type="module">
import { upload } from "https://esm.sh/@vercel/blob/client";
const form=document.getElementById("upload-form"),status=document.getElementById("status");
const MAX=50*1024*1024;
const slug=s=>s.toLowerCase().trim().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50);
async function send(file,path,contentType){
 if(!file)return null;
 return upload(path,file,{access:"public",handleUploadUrl:"/api/blob-upload",contentType,multipart:file.size>4*1024*1024,onUploadProgress:p=>{status.textContent=`Uploading ${file.name}: ${Math.round(p.percentage)}%`}});
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 try{
  const zip=document.getElementById("zip").files[0];
  if(!zip||zip.size>MAX)throw new Error("The ZIP must be 50 MB or smaller.");
  const name=document.getElementById("name").value;
  const id=slug(name); if(!id)throw new Error("Invalid mod name.");
  status.textContent="Uploading ZIP...";
  const z=await send(zip,`mods/${id}/${id}.zip`,"application/zip");
  const i=await send(document.getElementById("icon").files[0],`mods/${id}/icon.png`,"image/png");
  const b=await send(document.getElementById("banner").files[0],`mods/${id}/banner.png`,"image/png");
  status.textContent="Saving mod information...";
  const meta={id,name,version:document.getElementById("version").value,smalldesc:document.getElementById("smalldesc").value,description:document.getElementById("description").value,credits:document.getElementById("credits").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),date:new Date().toISOString(),icon:i?.url||"",banner:b?.url||"",download:z?.downloadUrl||z?.url||""};
  const r=await fetch("/api/mods",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)});
  const out=await r.json(); if(!r.ok)throw new Error(out.error||"Could not save mod");
  status.textContent="Mod uploaded! Redirecting...";
  location.href=`mod.html?id=${encodeURIComponent(id)}`;
 }catch(err){console.error(err);status.textContent="ERROR: "+err.message;}
});
</script>
</body>
</html>
