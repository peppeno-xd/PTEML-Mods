<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Profile - PTEM Mods</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scanlines"></div>

<header class="site-header">

  <div class="brand">
    <img
      src="assets/logo.png"
      class="logo-image"
      alt="PTEM Mods"
    >
  </div>

  <nav class="main-nav">

    <a href="index.html">
      <img src="assets/nav-mods.png" alt="">
      Mods
    </a>

    <a href="login.html">
      <img src="assets/nav-login.png" alt="">
      Log In
    </a>

    <a href="signup.html">
      <img src="assets/nav-signup.png" alt="">
      Sign Up
    </a>

    <script
      type="module"
      src="auth-ui.js">
    </script>

    <a href="upload.html">
      <img src="assets/nav-upload.png" alt="">
      Upload
    </a>

  </nav>

</header>


<main class="page">

  <div class="mod-topbar">

    <a
      class="back-link"
      href="index.html">
      ← Go Back
    </a>

  </div>


  <section id="profile">

    <p class="empty">
      Loading profile...
    </p>

  </section>


  <section>

    <h2 class="panel-title">
      Mods
    </h2>

    <div
      id="profile-mods"
      class="mod-grid">
    </div>

    <p
      id="no-mods"
      class="empty hidden">
      This user has no mods yet. :(
    </p>

  </section>

</main>


<footer>
  PTEM LOADER MODS
</footer>


<script
  type="module"
  src="profile.js">
</script>

</body>
</html>
